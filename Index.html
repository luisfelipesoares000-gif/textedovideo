<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tempo Diário — Gerador de Vídeo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #16192b 0%, #262b47 60%, #3a3052 100%);
      color: #f5f5fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 820px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .badge {
      display: inline-block;
      background: rgba(255, 214, 153, 0.15);
      color: #ffd699;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    h1 { font-size: 26px; margin-bottom: 8px; }
    p.sub { color: #c7cbe0; font-size: 15px; margin-bottom: 22px; }
    video {
      width: 100%;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background: #ffd699;
      color: #1b1d2e;
      text-decoration: none;
      font-weight: 700;
      padding: 14px 26px;
      border-radius: 14px;
      font-size: 16px;
    }
    .aviso {
      margin-top: 16px;
      font-size: 13px;
      color: #9fa5c2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">@tempodiario</div>
    <h1>Tempo Diário — O Bom Samaritano</h1>
    <p class="sub">Animação 2D com duas vozes calmas estilo ASMR</p>

    <video controls playsinline preload="metadata">
      <source src="video.mp4" type="video/mp4" />
      Seu navegador não suporta vídeo HTML5.
    </video>

    <br />
    <a class="btn" href="video.mp4" download="tempo_diario_video.mp4">
      Baixar Vídeo (.mp4)
    </a>

    <p class="aviso">
      Se o vídeo ainda não aparecer, aguarde cerca de 1 minuto após rodar a aba <strong>Actions</strong> e recarregue esta página.
    </p>
  </div>
</body>
</html>
